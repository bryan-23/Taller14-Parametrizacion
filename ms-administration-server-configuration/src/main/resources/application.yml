server:
  port: 8890
spring:
  application:
    name: ms-administration-server-configuration

#Configuracion Local
  profiles:
    active: native
  cloud:
    config:
      server: 
        native:
          # CONFIG_REPO_PATH permite a cada participante apuntar a su carpeta; por defecto,
          # ruta relativa al módulo (funciona al arrancar con gradlew bootRun desde esta carpeta).
          search-locations: ${CONFIG_REPO_PATH:file:../ms-administration-data-configuration}